<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Голосовая станция с ИИ на ESP32-S3</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="light">
<div id="wrapper">

    <div id="header">
    <div class="logo">
        <a href="index.html" class="logo-link">ТАМС</a>
    </div>

    <!-- Кнопка бургера (видна только на мобильных) -->
    <button class="burger" id="burger" aria-label="Меню">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <!-- Меню со ссылками -->
    <nav class="download" id="navMenu">
        <a href="downloaddark.html" class="theme">
            <img src="assets/img/bi_moon.svg" alt="">
        </a>
        <a href="ENGdownload.html" class="lang">ENG</a>
        <a href="download.html">Загрузить</a>
    </nav>
</div>

    <div id="loader">
        <div class="loaderblock"><img src="assets/img/lets-icons_img-box.svg" alt="">
            <p>Загрузка для Android</p>
            <a href="">Загрузить</a>
        </div>
        <div class="loaderblock">
            <img src="assets/img/lets-icons_img-box.svg" alt="">
            <p>Загрузка для IOS</p>
            <a href="">Загрузить</a>
        </div>
    </div>


    <div id="syllable">
        <div class="syllableblock">
            <p>Подробнее</p>
        </div>
    </div>

    <div id="footer">
  <div class="footer-col">
    <h3>Контакты</h3>
    <ul class="contacts">
      <li>
        <a href="tel:+79991234567">
          <span class="icon"></span> +7 (999) 123-45-67
        </a>
      </li>
      <li>
        <a href="tel:+74951234567">
          <span class="icon"></span> +7 (495) 123-45-67
        </a>
      </li>
      <li>
        <a href="mailto:info@tams.ru">
          <span class="icon"></span> info@tams.ru
        </a>
      </li>
    </ul>
  </div>

  <div class="footer-col">
    <h3>Мы в соцсетях</h3>
    <div class="socials">
      <a href="https://email" target="_blank" rel="noopener" aria-label="Email"><img src="assets/img/entypo_email.svg" alt=""></a>
      <a href="https://vk.com" target="_blank" rel="noopener" aria-label="VK"><img src="assets/img/Vector.svg" alt=""></a>

  <div class="footer-col">

    <a href="mailto:info@tams.ru?subject=Заявка с сайта" class="btn-contact">
      Связаться
    </a>
  </div>
</div>

</div>
<script>
    const burger = document.getElementById('burger');
    const navMenu = document.getElementById('navMenu');

    burger.addEventListener('click', () => {
        burger.classList.toggle('active');
        navMenu.classList.toggle('open');
    });

    // Закрыть меню при клике на ссылку
    navMenu.querySelectorAll('a').forEach(link => {
        link.addEventListener('click', () => {
            burger.classList.remove('active');
            navMenu.classList.remove('open');
        });
    });
</script>
</body>
</html>
